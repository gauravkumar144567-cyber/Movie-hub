
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuva Movie Hub</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0b0b0b;
color:white;
}

header{
background:#111;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
position:sticky;
top:0;
}

.search-box{
padding:10px;
text-align:center;
}

.search-box input{
width:90%;
padding:10px;
border-radius:6px;
border:none;
font-size:16px;
}

.container{
padding:15px;
}

.movie-card{
background:#1a1a1a;
border-radius:10px;
padding:10px;
margin-bottom:15px;
}

.movie-card img{
width:100%;
border-radius:10px;
}

.rating{
color:gold;
margin:5px 0;
}

button{
background:#22c55e;
border:none;
padding:10px;
border-radius:6px;
color:white;
font-weight:bold;
width:100%;
cursor:pointer;
}

.suggestions{
display:flex;
overflow-x:auto;
gap:10px;
margin-top:10px;
}

.suggestions img{
width:120px;
border-radius:8px;
}

#adPopup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
color:white;
}
</style>
</head>

<body>

<header>🎬 Yuva Movie Hub</header>

<div class="search-box">
<input type="text" placeholder="Search movies...">
</div>

<div class="container">

<div class="movie-card">
<img src="https://m.media-amazon.com/images/I/81p+xe8cbnL._AC_SY679_.jpg">
<h3>Avengers Endgame</h3>
<div class="rating">⭐ 4.8 / 5</div>
<button onclick="openDownload('Avengers Endgame','https://m.media-amazon.com/images/I/81p+xe8cbnL._AC_SY679_.jpg')">
Download
</button>
</div>

<div id="downloadSection"></div>

</div>

<div id="adPopup">
<h2>Advertisement</h2>
<p>Download starting in <span id="adTimer">5</span> seconds...</p>
</div>

<script>

let currentMovie = "";
let currentImage = "";

function openDownload(name,img){
currentMovie=name;
currentImage=img;

document.getElementById("downloadSection").innerHTML=
`
<div class="movie-card">
<img src="${img}" style="width:150px">
<h3>${name}</h3>

<button onclick="downloadMovie()">Download 480p (500MB)</button>
<br><br>
<button onclick="downloadMovie()">Download 720p (1GB)</button>

<h4 style="margin-top:15px;">More Like This</h4>
<div class="suggestions">
<img src="https://m.media-amazon.com/images/I/91HHqVTAJQL._AC_SY679_.jpg">
<img src="https://m.media-amazon.com/images/I/71niXI3lxlL._AC_SY679_.jpg">
</div>
</div>
`;
}

function downloadMovie(){

let timer=5;
document.getElementById("adPopup").style.display="flex";
document.getElementById("adTimer").innerText=timer;

let interval=setInterval(function(){
timer--;
document.getElementById("adTimer").innerText=timer;

if(timer<=0){
clearInterval(interval);
document.getElementById("adPopup").style.display="none";
alert("Downloading " + currentMovie);
}
},1000);

}

</script>

</body>
</html>
